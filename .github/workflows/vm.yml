name: vm
on: [push, workflow_dispatch]
jobs:
  vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          mkdir -p out
          gcc -Wall -Wextra -O2 -fsanitize=address,undefined -o out/test_vm vm/test_vm.c vm/vm.c
          ./out/test_vm | tee out/vm_tests.txt
          grep -q "VM TESTS PASS" out/vm_tests.txt
      - name: Console input helper tests
        run: |
          gcc -Wall -Wextra -O2 -fsanitize=address,undefined -o out/test_vmio vm/test_vmio.c vm/vmio.c vm/vm.c
          ./out/test_vmio | tee out/vmio_tests.txt
          grep -q "VMIO TESTS PASS" out/vmio_tests.txt
      - name: Assemble and run example
        run: |
          python3 tools/ptasm.py examples/hello.pta out/hello.ptb
          gcc -Wall -Wextra -O2 -o out/host vm/host.c vm/vmio.c vm/vm.c
          ./out/host out/hello.ptb | tee out/hello.txt
          grep -qx "Hello from PT bytecode" out/hello.txt
          grep -qx "3628800" out/hello.txt
      - name: Slog examples
        run: |
          for f in privet fakt prostye sort sito stroki; do
            python3 tools/slog.py examples/$f.sl out/$f.pta
            python3 tools/ptasm.py out/$f.pta out/$f.ptb
            ./out/host out/$f.ptb | tee out/$f.txt
          done
          grep -qx "Привет, мир!" out/privet.txt
          grep -qx "факториал 10 = 3628800" out/fakt.txt
          grep -qx "всего: 15" out/prostye.txt
          grep -qx "по порядку:" out/sort.txt
          grep -qx "простых до 100 это 25" out/sito.txt
          grep -qx "компьютер наоборот: ретюьпмок" out/stroki.txt
          grep -qx "всего слов: 4 букв в первом: 5" out/stroki.txt
          python3 tools/slog.py examples/echo.sl out/echo.pta
          python3 tools/ptasm.py out/echo.pta out/echo.ptb
          printf 'Игмунд\n' | ./out/host out/echo.ptb | tee out/echo.txt
          grep -qx "Привет, Игмунд!" out/echo.txt
          grep -qx "букв в имени: 6" out/echo.txt
          python3 tools/slog.py examples/chisla.sl out/chisla.pta
          python3 tools/ptasm.py out/chisla.pta out/chisla.ptb
          printf '10 5 30 7 -2\n' | ./out/host out/chisla.ptb | tee out/chisla.txt
          grep -qx "по возрастанию: -2 5 7 10 30" out/chisla.txt
          grep -qx "сумма: 50 наибольшее: 30 наименьшее: -2" out/chisla.txt
      - name: Slog compiler tests
        run: |
          python3 tools/test_slog.py out/host | tee out/slog_tests.txt
          grep -q "SLOG TESTS PASS" out/slog_tests.txt
      - name: Slog compiler tests, part 2 (lists, loops, numbers)
        run: |
          python3 tools/test_slog2.py out/host | tee out/slog2_tests.txt
          grep -q "SLOG2 TESTS PASS" out/slog2_tests.txt
      - name: Slog compiler tests, part 3 (strings and types)
        run: |
          python3 tools/test_slog3.py out/host | tee out/slog3_tests.txt
          grep -q "SLOG3 TESTS PASS" out/slog3_tests.txt
      - name: Slog compiler tests, part 5 (modules and libraries)
        run: |
          python3 tools/test_slog5.py out/host | tee out/slog5_tests.txt
          grep -q "SLOG5 TESTS PASS" out/slog5_tests.txt
      - name: Slog compiler tests, part 4 (console input)
        run: |
          python3 tools/test_slog4.py out/host | tee out/slog4_tests.txt
          grep -q "SLOG4 TESTS PASS" out/slog4_tests.txt
      - name: Filesystem test
        run: |
          python3 tools/ptasm.py examples/fib.pta out/fib.ptb
          python3 tools/mkfs.py out/fs.img out/hello.ptb out/fib.ptb examples/readme.txt
          python3 tools/mkmedia.py out/floppyB.img --kernel out/fs.img --label PT-USER --cls 2
          gcc -Wall -Wextra -O2 -fsanitize=address,undefined -o out/test_ptfs kernel/test_ptfs.c kernel/ptfs.c vm/vm.c
          ./out/test_ptfs out/floppyB.img | tee out/ptfs.txt
          grep -q "PTFS TESTS PASS" out/ptfs.txt
      - name: Build VM and filesystem for RV32 (no libc)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
          CF="-march=rv32imc_zicsr -mabi=ilp32 -O2 -Wall -Wextra -ffreestanding -nostdlib"
          riscv64-unknown-elf-gcc $CF -c vm/vm.c -o out/vm_rv32.o
          riscv64-unknown-elf-gcc $CF -c vm/vmio.c -o out/vmio_rv32.o
          riscv64-unknown-elf-gcc $CF -c kernel/ptfs.c -o out/ptfs_rv32.o